# Setup tmux Config: /path/to/.tmux.conf

# Enable vim-style keys for copy mode
setw -g mode-keys vi

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use `C-s` as the prefix key
unbind C-s
set -g prefix C-s
bind C-s send-prefix

# Start copy mode
bind c copy-mode

set -g allow-rename on

# Set key bindings for copy mode (Visual Mode and Yank)
unbind -T copy-mode-vi v
unbind -T copy-mode-vi y
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel

# Enhanced vim motions for copy mode
bind-key -T copy-mode C-u send-keys -X halfpage-up
bind-key -T copy-mode C-d send-keys -X halfpage-down
bind-key -T copy-mode U send-keys -X halfpage-up
bind-key -T copy-mode D send-keys -X halfpage-down
bind-key -T copy-mode u send-keys -X halfpage-up
bind-key -T copy-mode d send-keys -X halfpage-down
bind-key -T copy-mode-vi C-f send-keys -X page-down
bind-key -T copy-mode-vi C-b send-keys -X page-up
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key -T copy-mode-vi U send-keys -X halfpage-up
bind-key -T copy-mode-vi D send-keys -X halfpage-down
bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi d send-keys -X halfpage-down
bind-key -T copy-mode-vi q send-keys -X cancel

# Plugin Configuration
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'tmux-plugins/tmux-fpp'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cheat-sheet'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @fpp-editor 'nvim'
set -s set-clipboard external

# Set options
set-option -sg escape-time 10

# Updated URL viewing command

bind-key u capture-pane \; \
   run-shell "~/tmux_urlview.sh" \; \
   if-shell "[ -s /tmp/tmux_urls_filtered ]" "popup -E -h 90% -w 70% 'urlview < /tmp/tmux_urls_filtered'"
bind-key U copy-mode \; send-keys -X halfpage-up
bind-key D copy-mode \; send-keys -X halfpage-down
bind-key -n M-u copy-mode \; send-keys -X halfpage-up

# Unbind and rebind C-r to reload tmux configuration
unbind r
bind r source-file ~/.tmux.conf

# Enable mouse support
set -g mouse on

# Navigation bindings
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key n new-window -c "#{pane_current_path}"
bind-key g split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"
bind-key f resize-pane -Z
bind-key s choose-tree -Zw
bind-key b run-shell "~/.tmux_sidebar.sh toggle-mode #{pane_id}"
bind-key x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind-key -n M-h select-pane -L
bind-key -n M-j if-shell -F '#{==:#{pane_title},tmux-sidebar}' 'run-shell "~/.tmux_sidebar.sh window next #{pane_id}"' 'select-pane -D'
bind-key -n M-k if-shell -F '#{==:#{pane_title},tmux-sidebar}' 'run-shell "~/.tmux_sidebar.sh window previous #{pane_id}"' 'select-pane -U'
bind-key -n M-l select-pane -R
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Up select-pane -U
bind-key -n M-Right select-pane -R

# Direct resize bindings (matching i3 pattern)
# C-h: grow width left, C-j: shrink height down, C-k: grow height up, C-l: shrink width right
bind-key -r C-h resize-pane -L 1
bind-key -r C-j resize-pane -D 1
bind-key -r C-k resize-pane -U 1
bind-key -r C-l resize-pane -R 1
bind-key -n C-M-h resize-pane -L 2
bind-key -n C-M-j resize-pane -D 2
bind-key -n C-M-k resize-pane -U 2
bind-key -n C-M-l resize-pane -R 2

# Zellij-style direct controls
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n M-0 select-window -t :=10
bind-key -n M-` new-window -c "#{pane_current_path}"
bind-key -n M-Enter split-window -c "#{pane_current_path}"
bind-key -n M-g split-window -v -c "#{pane_current_path}" "jibidi"
bind-key -n M-f resize-pane -Z
bind-key -n M-s choose-tree -Zw
bind-key -n M-p display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "yazi"
bind-key -n M-q kill-pane
bind-key -n M-w confirm-before -p "kill window #W? (y/n)" kill-window
bind-key -n M-H swap-pane -U
bind-key -n M-L swap-pane -D

bind-key -T tmux-sidebar 0 run-shell "~/.tmux_sidebar.sh count 0 #{pane_id}"
bind-key -T tmux-sidebar 1 run-shell "~/.tmux_sidebar.sh count 1 #{pane_id}"
bind-key -T tmux-sidebar 2 run-shell "~/.tmux_sidebar.sh count 2 #{pane_id}"
bind-key -T tmux-sidebar 3 run-shell "~/.tmux_sidebar.sh count 3 #{pane_id}"
bind-key -T tmux-sidebar 4 run-shell "~/.tmux_sidebar.sh count 4 #{pane_id}"
bind-key -T tmux-sidebar 5 run-shell "~/.tmux_sidebar.sh count 5 #{pane_id}"
bind-key -T tmux-sidebar 6 run-shell "~/.tmux_sidebar.sh count 6 #{pane_id}"
bind-key -T tmux-sidebar 7 run-shell "~/.tmux_sidebar.sh count 7 #{pane_id}"
bind-key -T tmux-sidebar 8 run-shell "~/.tmux_sidebar.sh count 8 #{pane_id}"
bind-key -T tmux-sidebar 9 run-shell "~/.tmux_sidebar.sh count 9 #{pane_id}"
bind-key -T tmux-sidebar j run-shell "~/.tmux_sidebar.sh window next #{pane_id}"
bind-key -T tmux-sidebar k run-shell "~/.tmux_sidebar.sh window previous #{pane_id}"
bind-key -T tmux-sidebar M-j run-shell "~/.tmux_sidebar.sh window next #{pane_id}"
bind-key -T tmux-sidebar M-k run-shell "~/.tmux_sidebar.sh window previous #{pane_id}"
bind-key -T tmux-sidebar b run-shell "~/.tmux_sidebar.sh toggle-mode #{pane_id}"

# Tmux Battery Configuration
# Default battery thresholds and colors: low: red, medium: yellow, high: green
# Customize if required
set -g @batt_low_bg_color 'red'
set -g @batt_medium_bg_color 'yellow'
set -g @batt_high_bg_color 'green'

# Zellij-inspired Nord styling: compact top tabs, quiet pane borders.
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 32
set -g status-right-length 120
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#2e3440]"
set -g status-right "#{?client_prefix,#[fg=#2e3440,bg=#ebcb8b,bold] PREFIX #[fg=#ebcb8b,bg=#2e3440],}#[fg=#81a1c1] #{pane_current_path} #[fg=#4c566a]| #[fg=#a3be8c]%H:%M "
setw -g window-status-format "#[fg=#81a1c1] #I #[fg=#d8dee9]#W "
setw -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0,bold] #I #[fg=#2e3440,bg=#88c0d0]#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
set -g display-panes-active-colour "#88c0d0"
set -g display-panes-colour "#4c566a"
set -g message-style "bg=#3b4252,fg=#eceff4"
set -g mode-style "bg=#434c5e,fg=#eceff4"

# Keep the session-level sidebar visible when moving between windows and keep key mode aligned with focus.
set-hook -g after-select-window "run-shell '~/.tmux_sidebar.sh ensure #{pane_id}' \; run-shell '~/.tmux_sidebar.sh focus #{pane_id}'"
set-hook -g after-select-pane "run-shell '~/.tmux_sidebar.sh focus #{pane_id}'"

# Initialize TMUX plugin manager (TPM)
run '~/.tmux/plugins/tpm/tpm'  # This should be at the bottom
