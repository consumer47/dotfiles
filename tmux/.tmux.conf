# Setup tmux Config: /path/to/.tmux.conf

# Enable vim-style keys for copy mode
setw -g mode-keys vi

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use `C-s` as the prefix key
unbind C-s
set -g prefix C-s
bind C-s send-prefix

# Start copy mode
bind c copy-mode

set -g allow-rename off
setw -g automatic-rename off

# Set key bindings for copy mode (Visual Mode and Yank)
unbind -T copy-mode-vi v
unbind -T copy-mode-vi y
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-no-clear
bind-key -T copy-mode y send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi C-j send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi A send-keys -X append-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode C-w send-keys -X copy-pipe-no-clear
bind-key -T copy-mode M-w send-keys -X copy-pipe-no-clear
bind-key -T copy-mode C-k send-keys -X copy-pipe-end-of-line
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-no-clear

# Enhanced vim motions for copy mode
bind-key -T copy-mode C-u send-keys -X halfpage-up
bind-key -T copy-mode C-d send-keys -X halfpage-down
bind-key -T copy-mode U send-keys -X halfpage-up
bind-key -T copy-mode D send-keys -X halfpage-down
bind-key -T copy-mode u send-keys -X halfpage-up
bind-key -T copy-mode d send-keys -X halfpage-down
bind-key -T copy-mode M-u send-keys -X halfpage-up
bind-key -T copy-mode M-d send-keys -X halfpage-down
bind-key -T copy-mode-vi C-f send-keys -X page-down
bind-key -T copy-mode-vi C-b send-keys -X page-up
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key -T copy-mode-vi U send-keys -X halfpage-up
bind-key -T copy-mode-vi D send-keys -X halfpage-down
bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi d send-keys -X halfpage-down
bind-key -T copy-mode-vi M-u send-keys -X halfpage-up
bind-key -T copy-mode-vi M-d send-keys -X halfpage-down
bind-key -T copy-mode-vi q send-keys -X cancel

# Plugin Configuration
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'tmux-plugins/tmux-fpp'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cheat-sheet'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @fpp-editor 'nvim'
set -s set-clipboard external

# Set options
set-option -sg escape-time 10

# Updated URL viewing command

bind-key u capture-pane \; \
   run-shell "~/tmux_urlview.sh" \; \
   if-shell "[ -s /tmp/tmux_urls_filtered ]" "popup -E -h 90% -w 70% 'urlview < /tmp/tmux_urls_filtered'"
bind-key U copy-mode \; send-keys -X halfpage-up
bind-key D copy-mode \; send-keys -X halfpage-down
bind-key -n M-u copy-mode \; send-keys -X halfpage-up
bind-key -n M-d copy-mode \; send-keys -X halfpage-down

# Unbind and rebind C-r to reload tmux configuration
unbind r
bind r source-file ~/.tmux.conf

# Enable mouse support
set -g mouse on

# Navigation bindings
bind-key h if-shell -F '#{window_zoomed_flag}' 'select-pane -L \; resize-pane -Z' 'select-pane -L'
bind-key j if-shell -F '#{window_zoomed_flag}' 'select-pane -D \; resize-pane -Z' 'select-pane -D'
bind-key k if-shell -F '#{window_zoomed_flag}' 'select-pane -U \; resize-pane -Z' 'select-pane -U'
bind-key l if-shell -F '#{window_zoomed_flag}' 'select-pane -R \; resize-pane -Z' 'select-pane -R'
bind-key n new-window -c "#{pane_current_path}"
bind-key g split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"
bind-key f resize-pane -Z
bind-key s choose-tree -Zw
bind-key b run-shell "~/.tmux_sidebar.sh toggle-mode"
bind-key x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind-key -n M-h previous-window
bind-key -n M-j if-shell -F '#{==:#{pane_title},tmux-sidebar}' 'run-shell "~/.tmux_sidebar.sh window next #{pane_id}"' "if-shell -F '#{window_zoomed_flag}' 'select-pane -D \; resize-pane -Z' 'select-pane -D'"
bind-key -n M-k if-shell -F '#{==:#{pane_title},tmux-sidebar}' 'run-shell "~/.tmux_sidebar.sh window previous #{pane_id}"' "if-shell -F '#{window_zoomed_flag}' 'select-pane -U \; resize-pane -Z' 'select-pane -U'"
bind-key -n M-l next-window
bind-key -n M-Left if-shell -F '#{window_zoomed_flag}' 'select-pane -L \; resize-pane -Z' 'select-pane -L'
bind-key -n M-Down if-shell -F '#{window_zoomed_flag}' 'select-pane -D \; resize-pane -Z' 'select-pane -D'
bind-key -n M-Up if-shell -F '#{window_zoomed_flag}' 'select-pane -U \; resize-pane -Z' 'select-pane -U'
bind-key -n M-Right if-shell -F '#{window_zoomed_flag}' 'select-pane -R \; resize-pane -Z' 'select-pane -R'

# Direct resize bindings (matching i3 pattern)
# C-h: grow width left, C-j: shrink height down, C-k: grow height up, C-l: shrink width right
bind-key -r C-h resize-pane -L 1
bind-key -r C-j resize-pane -D 1
bind-key -r C-k resize-pane -U 1
bind-key -r C-l resize-pane -R 1
bind-key -n C-M-h resize-pane -L 2
bind-key -n C-M-j resize-pane -D 2
bind-key -n C-M-k resize-pane -U 2
bind-key -n C-M-l resize-pane -R 2

# Zellij-style direct controls
bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n M-0 select-window -t :=10
bind-key -n M-` new-window -c "#{pane_current_path}"
bind-key -n M-Enter split-window -c "#{pane_current_path}"
bind-key -n M-g split-window -v -c "#{pane_current_path}" "jibidi"
bind-key -n M-f resize-pane -Z
bind-key -n M-s choose-tree -Zw
bind-key -n M-b run-shell "~/.tmux_sidebar.sh toggle window"
bind-key -n M-B run-shell "~/.tmux_sidebar.sh toggle session"
bind-key -n M-x switch-client -T launch-target \; display-message "launch: p pane | w window | s session | P profiles | q cancel"
bind-key -n M-r switch-client -T rename-target \; display-message "rename: p pane | w window | s session | q cancel"
bind-key -n M-n run-shell "~/.tmux_sidebar.sh popup-latest #{pane_id}"
bind-key -n M-N run-shell "~/.tmux_sidebar.sh popup-latest #{pane_id}"
bind-key -n M-p display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "yazi"
bind-key -n M-q kill-pane
bind-key -n M-w confirm-before -p "kill window #W? (y/n)" kill-window
bind-key -n M-H swap-pane -U
bind-key -n M-L swap-pane -D

bind-key -T launch-target p run-shell "~/.tmux_sidebar.sh launch-pane #{pane_id}" \; run-shell "~/.tmux_sidebar.sh focus #{pane_id}"
bind-key -T launch-target w run-shell "~/.tmux_sidebar.sh launch-window #{pane_id}" \; run-shell "~/.tmux_sidebar.sh focus #{pane_id}"
bind-key -T launch-target s run-shell "~/.tmux_sidebar.sh launch-session #{pane_id}" \; run-shell "~/.tmux_sidebar.sh focus #{pane_id}"
bind-key -T launch-target P run-shell "~/.tmux_sidebar.sh profile-menu #{pane_id}" \; run-shell "~/.tmux_sidebar.sh focus #{pane_id}"
bind-key -T launch-target d run-shell "~/.tmux_sidebar.sh detach"
bind-key -T launch-target q run-shell "~/.tmux_sidebar.sh focus"
bind-key -T launch-target Escape run-shell "~/.tmux_sidebar.sh focus"

bind-key -T rename-target p run-shell "~/.tmux_sidebar.sh rename-pane" \; run-shell "~/.tmux_sidebar.sh focus"
bind-key -T rename-target w run-shell "~/.tmux_sidebar.sh rename-window" \; run-shell "~/.tmux_sidebar.sh focus"
bind-key -T rename-target s run-shell "~/.tmux_sidebar.sh rename-session" \; run-shell "~/.tmux_sidebar.sh focus"
bind-key -T rename-target q run-shell "~/.tmux_sidebar.sh focus"
bind-key -T rename-target Escape run-shell "~/.tmux_sidebar.sh focus"

bind-key -T tmux-sidebar 0 run-shell "~/.tmux_sidebar.sh count 0"
bind-key -T tmux-sidebar 1 run-shell "~/.tmux_sidebar.sh count 1"
bind-key -T tmux-sidebar 2 run-shell "~/.tmux_sidebar.sh count 2"
bind-key -T tmux-sidebar 3 run-shell "~/.tmux_sidebar.sh count 3"
bind-key -T tmux-sidebar 4 run-shell "~/.tmux_sidebar.sh count 4"
bind-key -T tmux-sidebar 5 run-shell "~/.tmux_sidebar.sh count 5"
bind-key -T tmux-sidebar 6 run-shell "~/.tmux_sidebar.sh count 6"
bind-key -T tmux-sidebar 7 run-shell "~/.tmux_sidebar.sh count 7"
bind-key -T tmux-sidebar 8 run-shell "~/.tmux_sidebar.sh count 8"
bind-key -T tmux-sidebar 9 run-shell "~/.tmux_sidebar.sh count 9"
bind-key -T tmux-sidebar j run-shell "~/.tmux_sidebar.sh window next"
bind-key -T tmux-sidebar k run-shell "~/.tmux_sidebar.sh window previous"
bind-key -T tmux-sidebar Enter run-shell "~/.tmux_sidebar.sh select"
bind-key -T tmux-sidebar M-h run-shell "~/.tmux_sidebar.sh window previous"
bind-key -T tmux-sidebar M-l run-shell "~/.tmux_sidebar.sh window next"
bind-key -T tmux-sidebar M-j run-shell "~/.tmux_sidebar.sh window next"
bind-key -T tmux-sidebar M-k run-shell "~/.tmux_sidebar.sh window previous"
bind-key -T tmux-sidebar M-x switch-client -T launch-target \; display-message "launch: p pane | w window | s session | P profiles | q cancel"
bind-key -T tmux-sidebar M-r switch-client -T rename-target \; display-message "rename: p pane | w window | s session | q cancel"
bind-key -T tmux-sidebar M-n run-shell "~/.tmux_sidebar.sh popup-latest #{pane_id}"
bind-key -T tmux-sidebar M-N run-shell "~/.tmux_sidebar.sh popup-latest #{pane_id}"
bind-key -T tmux-sidebar r run-shell "~/.tmux_sidebar.sh rename"
bind-key -T tmux-sidebar b run-shell "~/.tmux_sidebar.sh toggle-mode"

# Tmux Battery Configuration
# Default battery thresholds and colors: low: red, medium: yellow, high: green
# Customize if required
set -g @batt_low_bg_color 'red'
set -g @batt_medium_bg_color 'yellow'
set -g @batt_high_bg_color 'green'

# Zellij-inspired Nord styling: compact top tabs, quiet pane borders.
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 48
set -g status-right-length 120
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#2e3440] #[fg=#d8dee9]#I:#W "
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[default],}#[fg=#81a1c1] #{pane_current_path} #[fg=#4c566a]| #[fg=#a3be8c]%H:%M "
setw -g window-status-format "#[fg=#81a1c1] #I:#W "
setw -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0,bold] #I:#W "
setw -g window-status-separator " │ "

set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
set -g display-panes-active-colour "#88c0d0"
set -g display-panes-colour "#4c566a"
set -g message-style "bg=#3b4252,fg=#eceff4"
set -g mode-style "bg=#434c5e,fg=#eceff4"

# Keep the session-level sidebar visible when moving between windows and keep key mode aligned with focus.
set-hook -g after-select-window "run-shell '~/.tmux_sidebar.sh focus #{pane_id}'"
set-hook -g after-new-window "run-shell '~/.tmux_sidebar.sh ensure #{pane_id}'"

# Initialize TMUX plugin manager (TPM)
run '~/.tmux/plugins/tpm/tpm'  # This should be at the bottom
